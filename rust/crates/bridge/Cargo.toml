[package]
name = "ente-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "=0.32.2", features = ["tokio"] }
thiserror = "2.0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["sync", "rt-multi-thread"] }
ente-accounts = { path = "../../../vendor/ente/rust/crates/accounts" }
ente-auth = { path = "../../../vendor/ente/rust/crates/auth" }
ente-core = { path = "../../../vendor/ente/rust/crates/core" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["time"] }
dirs = "7.0.0"
postgresql_embedded = { version = "0.20.4", default-features = false, features = ["blocking", "rustls", "theseus"] }
ente-test-support = { path = "../../../vendor/ente/rust/crates/test-support" }
